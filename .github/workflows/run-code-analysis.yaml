name: Check code formatting and type hints

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      event_name:
        required: true
        type: string

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          # keep this pinned to the floor in pyproject.toml: ruff's default
          # rule set widens between minor releases, so an unpinned action
          # silently disagrees with what passes locally
          version: 0.16.0
          args: "check"
          src: "."

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0

      - name: Install dependencies
        run: uv sync

      # config-driven: [tool.mypy] files= decides the scope, so passing an
      # explicit path here would silently narrow it
      - name: Run mypy
        run: uv run mypy $(uv run qtpy mypy-args)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: pyqt6
