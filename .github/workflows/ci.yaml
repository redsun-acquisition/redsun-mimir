name: CI Pipeline

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint and type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      # mypy asks qtpy which binding it runs on, and importing the binding
      # loads Qt's libraries
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0

      # the same environments a contributor runs; a hook that rewrites a file
      # fails the run, so a fixable ruff violation still fails here
      - name: Run the commit hooks and mypy against both bindings
        run: uv run --locked --only-group tox tox -e lint,mypy-pyqt,mypy-pyside

  tests:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # every Python on Ubuntu; the two ends of the range elsewhere
        exclude:
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xinput0 libxcb-xfixes0 x11-utils libxcb-cursor0 \
            libopengl0

      # napari's canvas is a real OpenGL surface: QT_QPA_PLATFORM=offscreen
      # gives no GL context and QtViewer construction dies inside PyOpenGL.
      # pinned by SHA, as napari's own workflows do.
      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79 # v5.1.0
        with:
          qt: true
          wm: herbstluftwm

      - name: Install dependencies
        run: uv sync --locked

      # Auto-detects the device interface version from the installed
      # pymmcore/pymmcore-nano, so it must run after uv sync. Installs to the
      # directory find_micromanager() searches, the same one
      # `mmcore install --test-adapters` uses.
      # pinned by SHA: the action publishes no tags, and it puts binaries on
      # the runner. main = 501885f as of 2026-03-11.
      - uses: pymmcore-plus/setup-mm-test-adapters@501885fc43ebc486d3901441f1db4da8e04fdf54

      # The adapters are downloaded binaries, and the action falls back to the
      # latest release when detection fails; without this the mismatch would
      # surface much later as a loadDevice error naming neither cause.
      - name: Verify device adapters
        run: >
          uv run python -c
          "from pymmcore_plus import find_micromanager;
          assert find_micromanager(), 'no Micro-Manager device adapters found'"

      - name: Run tests with coverage
        run: uv run --locked coverage run -p -m pytest --color=yes
        env:
          MIMIR_TEST_OPENGL: "1"
          # p4p's native startup log, which a service writes to the output
          # pytest shows for a failing test
          PVXS_LOG: "pvxs.server.setup=DEBUG,pvxs.udp.setup=DEBUG,pvxs.tcp.setup=DEBUG,pvxs.iface=DEBUG,pvxs.sock=DEBUG"

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: covreport-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ./.coverage*
          include-hidden-files: true

  coverage:
    name: Upload coverage
    if: ${{ !cancelled() }}
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: covreport-*
          path: covreports
          merge-multiple: true

      - name: Combine coverage data
        run: |
          uv run --locked --only-group coverage coverage combine covreports
          uv run --locked --only-group coverage coverage xml -o coverage.xml
          uv run --locked --only-group coverage coverage report
          uv run --locked --only-group coverage coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload to codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # the one check the ruleset requires: a job skipped because a dependency
  # failed counts as passed, so this runs regardless and fails on its own
  all_checks:
    name: All Checks Passed
    if: ${{ !cancelled() }}
    needs: [checks, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  build:
    name: Build Package
    needs: [all_checks]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the changelog has a section for a final release
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            python3 scripts/release_notes.py extract "${GITHUB_REF_NAME#v}" > /dev/null
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Build a binary wheel and a source tarball
        run: uv build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
        name: pypi
        url: https://pypi.org/p/redsun-mimir
    permissions:
        id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
        - name: Download all the dists
          uses: actions/download-artifact@v8
          with:
            name: python-package-distributions
            path: dist/
        - name: Publish distribution to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1

  # final tags only: a release candidate's entries stay in changelog.d for
  # the final release's section
  github-release:
    name: Publish the GitHub release
    needs: publish-to-pypi
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Write the release's notes from its changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py extract "${GITHUB_REF_NAME#v}" > notes.md
          # a release published from the interface already exists; a tag pushed
          # from a clone has none yet
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
