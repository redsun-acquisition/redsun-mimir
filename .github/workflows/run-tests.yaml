name: Run tests

on:
  workflow_call:
    secrets:
      codecov_token:
        required: false

jobs:
  test:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xinput0 libxcb-xfixes0 x11-utils libxcb-cursor0 \
            libopengl0

      # napari's canvas is a real OpenGL surface: QT_QPA_PLATFORM=offscreen
      # gives no GL context and QtViewer construction dies inside PyOpenGL.
      # pinned by SHA, as napari's own workflows do.
      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4.3
        with:
          qt: true
          wm: herbstluftwm

      - name: Install dependencies
        run: uv sync --locked

      # Auto-detects the device interface version from the installed
      # pymmcore/pymmcore-nano, so it must run after uv sync. Installs to the
      # directory find_micromanager() searches, the same one
      # `mmcore install --test-adapters` uses.
      # pinned by SHA: the action publishes no tags, and it puts binaries on
      # the runner. main = 501885f as of 2026-03-11.
      - uses: pymmcore-plus/setup-mm-test-adapters@501885fc43ebc486d3901441f1db4da8e04fdf54

      # The adapters are downloaded binaries, and the action falls back to the
      # latest release when detection fails; without this the mismatch would
      # surface much later as a loadDevice error naming neither cause.
      - name: Verify device adapters
        run: >
          uv run python -c
          "from pymmcore_plus import find_micromanager;
          assert find_micromanager(), 'no Micro-Manager device adapters found'"

      - name: Run tests with coverage
        run: uv run --locked coverage run -p -m pytest --color=yes --log-cli-level=DEBUG
        env:
          MIMIR_TEST_OPENGL: "1"

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: covreport-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ./.coverage*
          include-hidden-files: true

  upload_coverage:
    name: Upload coverage
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: covreport-*
          path: covreports
          merge-multiple: true

      - name: Combine coverage data
        run: |
          uv run coverage combine covreports
          uv run coverage xml -o coverage.xml
          uv run coverage report
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload to codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.codecov_token }}
