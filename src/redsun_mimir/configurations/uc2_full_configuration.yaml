# UC2 hardware. Lays over common_configuration.yaml.

services:
  transport: pv-access
  camera_ioc:
    plugin_name: redsun-mimir
    plugin_id: mmcore-camera
    prefix: "MIMIR-ISCAT:"
    args: ["--adapter", "Daheng", "--device", "Camera"]

devices:
  serial:
    port: COM4
  stage: {}
  laser:
    wavelength: 650
