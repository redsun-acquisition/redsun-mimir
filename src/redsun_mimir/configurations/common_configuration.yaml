presenters:
  median_ctrl: {}
  det_ctrl:
    timeout: 2.0
  acq_ctrl: {}
  light_ctrl:
    timeout: 2.0
  motor_ctrl:
    timeout: 2.0

views:
  light_widget: {}
  motor_widget: {}
  acq_widget: {}
  img_widget: {}
  det_widget: {}
